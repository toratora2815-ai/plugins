name: Build plugins

on:
  push:
  workflow_dispatch:
    inputs:
      only:
        description: "この名前のものだけビルド（空なら全部）"
        required: false
        default: ""

# Releases にビルド結果を置くための権限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        plugin: [WoolFuzz, Nebula, PorchDrive, BalanceScope, Reference, HorizonSpread]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # push のときは、そのプラグインのフォルダが変わったときだけビルドする
      # （「Run workflow」ボタンから手動で動かしたときは全部ビルド）
      - name: Check changes
        id: changes
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ONLY="${{ github.event.inputs.only }}"
            if [ -z "$ONLY" ] || [ "$ONLY" = "${{ matrix.plugin }}" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}"); then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$CHANGED" | grep -q "^MyPlugins/${{ matrix.plugin }}/"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.plugin }} is unchanged - skipping build"
          fi

      - name: Configure
        if: steps.changes.outputs.build == 'true'
        working-directory: MyPlugins/${{ matrix.plugin }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build AU
        if: steps.changes.outputs.build == 'true'
        working-directory: MyPlugins/${{ matrix.plugin }}
        run: cmake --build build --config Release --target ${{ matrix.plugin }}_AU --parallel 4

      - name: Collect
        if: steps.changes.outputs.build == 'true'
        run: |
          mkdir -p out rel
          cp -R "MyPlugins/${{ matrix.plugin }}/build/${{ matrix.plugin }}_artefacts/Release/AU/"*.component out/
          codesign --force --deep --sign - out/*.component
          # Releases 用の zip（Mac の付加情報は入れない）
          ditto -c -k --norsrc --noextattr --noacl --keepParent out/*.component "rel/${{ matrix.plugin }}.zip"

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build == 'true'
        with:
          name: ${{ matrix.plugin }}-macOS
          path: out

      - name: Publish to Releases
        if: steps.changes.outputs.build == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Latest builds" --notes "最新のビルド（push のたびに自動で更新されます）" || true
          gh release upload latest "rel/${{ matrix.plugin }}.zip" --clobber

  # 単体アプリ（.app）のビルド
  build-app:
    strategy:
      fail-fast: false
      matrix:
        app: [ReferenceMonitor]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changes
        id: changes
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ONLY="${{ github.event.inputs.only }}"
            if [ -z "$ONLY" ] || [ "$ONLY" = "${{ matrix.app }}" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}"); then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$CHANGED" | grep -q "^MyPlugins/${{ matrix.app }}/"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }} is unchanged - skipping build"
          fi

      - name: Check AppleScript
        if: steps.changes.outputs.build == 'true' && hashFiles(format('MyPlugins/{0}/Source/MusicScript.h', matrix.app)) != ''
        shell: bash
        run: |
          # アプリの中の AppleScript が Mac で正しく読めるか（文法エラーがないか）を確かめる
          sed -n '/R"APPLESCRIPT(/,/)APPLESCRIPT"/p' "MyPlugins/${{ matrix.app }}/Source/MusicScript.h" | sed '1d;$d' > /tmp/poll.applescript
          cat /tmp/poll.applescript
          if ! osacompile -o /tmp/poll.scpt /tmp/poll.applescript 2> /tmp/osa.txt; then
            echo "::error::AppleScript does not compile: $(cat /tmp/osa.txt)"
            exit 1
          fi
          echo "AppleScript OK"

      - name: Configure
        if: steps.changes.outputs.build == 'true'
        working-directory: MyPlugins/${{ matrix.app }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build app
        if: steps.changes.outputs.build == 'true'
        working-directory: MyPlugins/${{ matrix.app }}
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --target ${{ matrix.app }} --parallel 4 2>&1 | tee build.log; then
            # エラー行を注記として残す（ログが読めないときの手がかり）
            grep -E "error:|error :|Undefined symbols|ld: " build.log | grep -v "^ *[0-9]* errors* generated" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          fi

      - name: Collect
        if: steps.changes.outputs.build == 'true'
        shell: bash
        run: |
          mkdir -p out
          APP=$(find "MyPlugins/${{ matrix.app }}/build/${{ matrix.app }}_artefacts" -maxdepth 3 -name "*.app" | head -1)
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E "NSAudioCapture|NSAppleEvents|LSMinimum|CFBundleIdentifier"
          # 実行権限を保つため、ここで zip にしてから Artifacts に入れる（Mac の付加情報は入れない）
          mkdir -p rel
          ditto -c -k --norsrc --noextattr --noacl --keepParent "$APP" "out/${{ matrix.app }}.zip"
          cp "out/${{ matrix.app }}.zip" rel/

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build == 'true'
        with:
          name: ${{ matrix.app }}-macOS
          path: out

      - name: Publish to Releases
        if: steps.changes.outputs.build == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Latest builds" --notes "最新のビルド（push のたびに自動で更新されます）" || true
          gh release upload latest "rel/${{ matrix.app }}.zip" --clobber
