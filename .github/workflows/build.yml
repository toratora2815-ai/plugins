name: Build plugins

on:
  push:
  workflow_dispatch:
    inputs:
      only:
        description: "この名前のものだけビルド（空なら全部）"
        required: false
        default: ""
      runner:
        description: "使う Mac（混んでいるときは macos-15-intel を試す）"
        required: false
        default: "macos-latest"

# Releases にビルド結果を置くための権限
permissions:
  contents: write

jobs:
  # どれをビルドするかを、混んでいない Linux のマシンで先に決める。
  # Mac は「本当にビルドするもの」の分だけ借りる。
  # プラグイン／アプリは MyPlugins/ の下から自動で見つける（matrix に名前を足す必要はない）:
  #   CMakeLists.txt に juce_add_plugin があればプラグイン、juce_add_gui_app があればアプリ
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.pick.outputs.plugins }}
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick targets
        id: pick
        shell: bash
        run: |
          ALL_PLUGINS=(); ALL_APPS=()
          for d in MyPlugins/*/; do
            n=$(basename "$d")
            f="$d/CMakeLists.txt"
            [ -f "$f" ] || continue
            if grep -q "juce_add_plugin" "$f"; then ALL_PLUGINS+=("$n")
            elif grep -q "juce_add_gui_app" "$f"; then ALL_APPS+=("$n"); fi
          done
          echo "plugins found: ${ALL_PLUGINS[*]}"
          echo "apps found:    ${ALL_APPS[*]}"

          # ビルドするかどうか（引数: 名前）
          CHANGED=""; MODE="changed"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="manual"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}"); then
              MODE="all"
            fi
          fi
          # 説明（.md）だけの変更ではビルドしない
          CHANGED=$(echo "$CHANGED" | grep -v '\.md$' || true)
          ONLY="${{ github.event.inputs.only }}"
          # MyPlugins/Shared が変わったら、CMakeLists で ../Shared を使っているものも一緒にビルド
          SHARED_CHANGED=0
          echo "$CHANGED" | grep -q "^MyPlugins/Shared/" && SHARED_CHANGED=1
          want() {
            case "$MODE" in
              all)    return 0 ;;
              manual) [ -z "$ONLY" ] || [ "$ONLY" = "$1" ] ;;
              *)      echo "$CHANGED" | grep -q "^MyPlugins/$1/" && return 0
                      [ "$SHARED_CHANGED" = 1 ] && grep -q '\.\./Shared' "MyPlugins/$1/CMakeLists.txt" ;;
            esac
          }
          to_json() { local out="" x; for x in "$@"; do out="$out\"$x\","; done; echo "[${out%,}]"; }

          P=(); A=()
          for n in "${ALL_PLUGINS[@]}"; do want "$n" && P+=("$n"); done
          for n in "${ALL_APPS[@]}";    do want "$n" && A+=("$n"); done
          echo "plugins=$(to_json "${P[@]}")" >> "$GITHUB_OUTPUT"
          echo "apps=$(to_json "${A[@]}")"    >> "$GITHUB_OUTPUT"
          echo "will build plugins: ${P[*]:-(none)}"
          echo "will build apps:    ${A[*]:-(none)}"

      # 消したプラグイン／アプリ（MyPlugins/ にフォルダがないもの）の zip を Releases の latest から消す
      # （残っていると install-app.sh や手動ダウンロードで入れ直してしまうため）
      - name: Remove zips of deleted ones from Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest --json assets -q '.assets[].name' 2>/dev/null | while read -r a; do
            n="${a%.zip}"
            [ "$n" = "$a" ] && continue
            if [ ! -d "MyPlugins/$n" ]; then
              echo "remove $a"
              gh release delete-asset latest "$a" -y || true
            fi
          done

  # AU プラグインのビルド
  build:
    needs: detect
    if: needs.detect.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.detect.outputs.plugins) }}
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        working-directory: MyPlugins/${{ matrix.plugin }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build AU
        working-directory: MyPlugins/${{ matrix.plugin }}
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --target ${{ matrix.plugin }}_AU --parallel 4 2>&1 | tee build.log; then
            # エラー行を注記として残す（ログが読めないときの手がかり）
            grep -E "error:|error :|Undefined symbols|ld: " build.log | grep -v "^ *[0-9]* errors* generated" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          fi

      - name: Collect
        run: |
          mkdir -p out rel
          cp -R "MyPlugins/${{ matrix.plugin }}/build/${{ matrix.plugin }}_artefacts/Release/AU/"*.component out/
          codesign --force --deep --sign - out/*.component
          # Releases 用の zip（Mac の付加情報は入れない）
          ditto -c -k --norsrc --noextattr --noacl --keepParent out/*.component "rel/${{ matrix.plugin }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-macOS
          path: out

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Latest builds" --notes "最新のビルド（push のたびに自動で更新されます）" || true
          gh release upload latest "rel/${{ matrix.plugin }}.zip" --clobber

  # 単体アプリ（.app）のビルド
  build-app:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check AppleScript
        if: hashFiles(format('MyPlugins/{0}/Source/MusicScript.h', matrix.app)) != ''
        shell: bash
        run: |
          # アプリの中の AppleScript が Mac で正しく読めるか（文法エラーがないか）を確かめる
          sed -n '/R"APPLESCRIPT(/,/)APPLESCRIPT"/p' "MyPlugins/${{ matrix.app }}/Source/MusicScript.h" | sed '1d;$d' > /tmp/poll.applescript
          cat /tmp/poll.applescript
          if ! osacompile -o /tmp/poll.scpt /tmp/poll.applescript 2> /tmp/osa.txt; then
            echo "::error::AppleScript does not compile: $(cat /tmp/osa.txt)"
            exit 1
          fi
          echo "AppleScript OK"

      - name: Configure
        working-directory: MyPlugins/${{ matrix.app }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build app
        working-directory: MyPlugins/${{ matrix.app }}
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --target ${{ matrix.app }} --parallel 4 2>&1 | tee build.log; then
            grep -E "error:|error :|Undefined symbols|ld: " build.log | grep -v "^ *[0-9]* errors* generated" | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          fi

      - name: Collect
        shell: bash
        run: |
          mkdir -p out rel
          APP=$(find "MyPlugins/${{ matrix.app }}/build/${{ matrix.app }}_artefacts" -maxdepth 3 -name "*.app" | head -1)
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E "NSAudioCapture|NSAppleEvents|LSMinimum|CFBundleIdentifier"
          # 実行権限を保つため、ここで zip にしてから Artifacts に入れる（Mac の付加情報は入れない）
          ditto -c -k --norsrc --noextattr --noacl --keepParent "$APP" "out/${{ matrix.app }}.zip"
          cp "out/${{ matrix.app }}.zip" rel/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-macOS
          path: out

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Latest builds" --notes "最新のビルド（push のたびに自動で更新されます）" || true
          gh release upload latest "rel/${{ matrix.app }}.zip" --clobber
